name: autoBuilder


on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      CACHE_SCHEMA: v1
      CCACHE_DIR: ${{ github.workspace }}/.gha-cache/ccache/${{ matrix.os }}/${{ matrix.build_type }}
      CONAN_HOME: ${{ github.workspace }}/.gha-cache/conan/${{ matrix.os }}/${{ matrix.build_type }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            cmake_preset: windows-release
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            cmake_preset: linux-release
          - os: macOS-15
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            cmake_preset: macos-release
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: RelWithDebInfo
            cmake_preset: windows-relwithdebinfo
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: RelWithDebInfo
            cmake_preset: linux-relwithdebinfo
          - os: macOS-15
            c_compiler: clang
            cpp_compiler: clang++
            build_type: RelWithDebInfo
            cmake_preset: macos-relwithdebinfo
    steps:
    - uses: actions/checkout@v4
      with: 
        lfs: false
        fetch-depth: 1

    - name: Prepare cache directories
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "$env:CCACHE_DIR" -Force | Out-Null
        New-Item -ItemType Directory -Path "$env:CONAN_HOME" -Force | Out-Null

    - name: Restore Conan cache
      id: restore_conan_cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CONAN_HOME }}
        key: conan-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.c_compiler }}-${{ matrix.cpp_compiler }}-${{ hashFiles('conanfile.txt', 'BuildInitwithConan.sh', 'BuildInitwithConan.bat') }}-${{ env.CACHE_SCHEMA }}
        restore-keys: |
          conan-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.c_compiler }}-${{ matrix.cpp_compiler }}-
          conan-${{ runner.os }}-${{ matrix.build_type }}-

    - name: Restore ccache cache
      id: restore_ccache_cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.c_compiler }}-${{ matrix.cpp_compiler }}-${{ hashFiles('CMakeLists.txt', 'conanfile.txt', 'BuildInitwithConan.sh', 'BuildInitwithConan.bat') }}-${{ env.CACHE_SCHEMA }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.c_compiler }}-${{ matrix.cpp_compiler }}-
          ccache-${{ runner.os }}-${{ matrix.build_type }}-

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build/${{ matrix.cmake_preset }}" >> "$GITHUB_OUTPUT"
    
    - name: replace apple clang
      id: replace_apple_clang
      shell: bash
      if: runner.os == 'macOS'
      run: |
        #brew update
        #brew install llvm
        #echo "LLVM_PREFIX=$(brew --prefix llvm)" >> $GITHUB_ENV
        #echo "CC=$(brew --prefix llvm)/bin/clang" >> $GITHUB_ENV
        #echo "CXX=$(brew --prefix llvm)/bin/clang++" >> $GITHUB_ENV
        #echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
        #echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV
        #echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> $GITHUB_ENV
        #which clang && clang --version

        #export CC="$(brew --prefix llvm)/bin/clang"
        #export CXX="$(brew --prefix llvm)/bin/clang++"
        #export SDKROOT="$(xcrun --show-sdk-path)"
        #export MACOSX_DEPLOYMENT_TARGET=13.0

        echo "SDKROOT=$SDKROOT"
        echo "CC=$CC"
        echo "CXX=$CXX"

    - name: set conan
      id: set_conan
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install conan
        conan profile detect --force

    - name: init conan on windows
      id: init_conan_windows
      shell: pwsh
      if: runner.os == 'Windows'
      run: |
        cd "$env:GITHUB_WORKSPACE"
        ./BuildInitwithConan.bat . dynamic ${{ matrix.build_type }}
        
        
    - name: init conan on linux
      id: init_conan_on_linux
      shell: bash
      if: runner.os != 'Windows'
      run: |
        cd ${{ github.workspace }}
        bash BuildInitwithConan.sh . ${{ matrix.build_type }}
    
        
            

    - name: pull pdje
      id: pull_main_pdje
      shell: bash
      run: |
        GIT_LFS_SKIP_SMUDGE=1 git clone https://github.com/Rliop913/Project-DJ-Engine.git Project-DJ-Engine
        
        
    - name: set linux Requirements
      id: set_libevdev_and_ccache
      shell: bash
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -y
        sudo apt-get install libevdev-dev ccache swig libnuma-dev libsystemd-dev libasound2-dev libwayland-dev pkg-config

    - name: set macOS Requirements
      id: set_macos_ccache_swig
      shell: bash
      if: runner.os == 'macOS'
      run: |
        brew install swig ccache

    - name: set windows Requirements
      id: set_windows_ccache
      shell: pwsh
      if: runner.os == 'Windows'
      run: |
        choco install ccache -y --no-progress
        "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Reset ccache stats
      shell: bash
      run: |
        ccache --zero-stats

    - name: Probe build jobs
      id: build_jobs
      shell: pwsh
      run: |
        $count = [Environment]::ProcessorCount
        if ($count -lt 1) {
          $count = 1
        }
        "count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        Write-Host "Using $count build jobs"

    
    - name: Configure CMake
      if: runner.os != 'Windows'
      shell: bash
      run: >
        cmake --preset "${{ matrix.cmake_preset }}"
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      if: runner.os != 'Windows'
      shell: bash
      run: cmake --build --preset "${{ matrix.cmake_preset }}" --parallel "${{ steps.build_jobs.outputs.count }}"

    - name: Build
      if: runner.os == 'Windows'
      shell: cmd
      env:
        PDJE_CMAKE_EXTRA_ARGS: "-DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
      run: |
        call .\windows_conf_and_build.bat ${{ matrix.build_type }} ${{ steps.build_jobs.outputs.count }} off

    - name: Show ccache stats
      if: always()
      shell: bash
      run: |
        ccache --show-stats

    - name: Save Conan cache
      if: always() && !cancelled()
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CONAN_HOME }}
        key: conan-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.c_compiler }}-${{ matrix.cpp_compiler }}-${{ hashFiles('conanfile.txt', 'BuildInitwithConan.sh', 'BuildInitwithConan.bat') }}-${{ env.CACHE_SCHEMA }}

    - name: Save ccache cache
      if: always() && !cancelled()
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ matrix.build_type }}-${{ matrix.c_compiler }}-${{ matrix.cpp_compiler }}-${{ hashFiles('CMakeLists.txt', 'conanfile.txt', 'BuildInitwithConan.sh', 'BuildInitwithConan.bat') }}-${{ env.CACHE_SCHEMA }}

    - name: Upload failed artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.build_type }}-failedbuild
        path: ${{ steps.strings.outputs.build-output-dir }}

    - name: stage files
      if: success()
      id: stage_valid_files
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p staged_bins

        stage_by_name() {
          local root="$1"
          local name_pattern="$2"

          if [ ! -d "$root" ]; then
            return 0
          fi

          while IFS= read -r file; do
            local base
            base="$(basename "$file")"
            if [[ "$base" == *.so || "$base" == *.so.* || "$base" == *.dll || "$base" == *.dylib || "$base" == *.exe ]]; then
              echo "found: $file"
              cp -av "$file" ./staged_bins/
            fi
          done < <(find "$root" '(' -type f -o -type l ')' -name "$name_pattern" -print)
        }

        stage_package_dependency() {
          local name_pattern="$1"
          local package_root="$2"
          stage_by_name "${{ steps.strings.outputs.build-output-dir }}" "$name_pattern"
          stage_by_name "$package_root" "$name_pattern"
        }

        stage_runtime_dependency() {
          local name_pattern="$1"
          stage_by_name "${{ steps.strings.outputs.build-output-dir }}" "$name_pattern"
          stage_by_name "${{ steps.strings.outputs.build-output-dir }}/_deps/pdje_onnxruntime_prebuilt-src/lib" "$name_pattern"
          stage_by_name ./conan_cmakes/direct_deploy "$name_pattern"
        }

        require_staged_file() {
          local file_name="$1"
          if [ ! -e "./staged_bins/$file_name" ]; then
            echo "error: expected staged runtime file '$file_name'" >&2
            exit 1
          fi
        }

        require_staged_pattern() {
          local name_pattern="$1"
          if ! compgen -G "./staged_bins/$name_pattern" > /dev/null; then
            echo "error: expected staged runtime file matching '$name_pattern'" >&2
            exit 1
          fi
        }

        stage_by_name "${{ steps.strings.outputs.build-output-dir }}" "*PDJE*"
        stage_package_dependency "*hwy.*" ./conan_cmakes/direct_deploy/highway

        if [ "${{ runner.os }}" = "Windows" ]; then
          stage_package_dependency "*zlib*" ./conan_cmakes/direct_deploy/zlib
          stage_runtime_dependency "onnxruntime*.dll"
          require_staged_file "onnxruntime.dll"
          require_staged_file "onnxruntime_providers_shared.dll"
        elif [ "${{ runner.os }}" = "macOS" ]; then
          stage_package_dependency "*libz*" ./conan_cmakes/direct_deploy/zlib
          stage_runtime_dependency "libonnxruntime*.dylib"
          require_staged_pattern "libonnxruntime*.dylib"
        else
          stage_package_dependency "*libz*" ./conan_cmakes/direct_deploy/zlib
          stage_runtime_dependency "libonnxruntime*.so*"
          require_staged_pattern "libonnxruntime.so*"
          require_staged_file "libonnxruntime_providers_shared.so"
        fi

        ls -la staged_bins

    - name: Validate staged runtime dependencies
      if: success() && runner.os != 'Windows'
      shell: bash
      run: python .github/scripts/validate_staged_runtime_deps.py staged_bins

    - name: Validate staged runtime dependencies
      if: success() && runner.os == 'Windows'
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
        if not defined VSINSTALL (
          echo Visual Studio installation not found
          exit /b 1
        )
        call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
        python .github/scripts/validate_staged_runtime_deps.py staged_bins

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.build_type }}-success_builds
        path: staged_bins

    - name: stage versions
      if: runner.os == 'Linux' && matrix.build_type == 'Release'
      id: stage_valid_versions
      shell: bash
      run: |
        mkdir -p versions
        find ./ -type f -name "PDJE_VERSION" -print0 | xargs -0 cp -t versions/
        find ./ -type f -name "PDJE_WRAPPER_VERSION" -print0 | xargs -0 cp -t versions/
        

        
    - name: Upload versions
      if: runner.os == 'Linux' && matrix.build_type == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: version-of-success_builds
        path: versions

  autoUpload:
    name: Post step
    needs: build
    runs-on: ubuntu-latest
    if: success()
    env:
      GH_TOKEN: ${{ secrets.PDJE_AUTO_PUSH }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          pattern: '*success_builds'
          merge-multiple: false
          path: builds

      - run: |
          tree .
          gh auth setup-git 
          gh repo clone https://github.com/Rliop913/Project_DJ_Godot
          cd Project_DJ_Godot
          git lfs install --local
          git lfs pull
          cd ..
          mkdir -p Project_DJ_Godot/addons/Project_DJ_Godot/win/release
          mkdir -p Project_DJ_Godot/addons/Project_DJ_Godot/linux/release
          mkdir -p Project_DJ_Godot/addons/Project_DJ_Godot/macos/release
          mkdir -p Project_DJ_Godot/addons/Project_DJ_Godot/win/debug
          mkdir -p Project_DJ_Godot/addons/Project_DJ_Godot/linux/debug
          mkdir -p Project_DJ_Godot/addons/Project_DJ_Godot/macos/debug
          
          rm -f Project_DJ_Godot/addons/Project_DJ_Godot/win/release/* 2>/dev/null || true
          rm -f Project_DJ_Godot/addons/Project_DJ_Godot/linux/release/* 2>/dev/null || true
          rm -f Project_DJ_Godot/addons/Project_DJ_Godot/macos/release/* 2>/dev/null || true
          rm -f Project_DJ_Godot/addons/Project_DJ_Godot/win/debug/* 2>/dev/null || true
          rm -f Project_DJ_Godot/addons/Project_DJ_Godot/linux/debug/* 2>/dev/null || true
          rm -f Project_DJ_Godot/addons/Project_DJ_Godot/macos/debug/* 2>/dev/null || true
          
          sudo apt-get update
          sudo apt-get install -y p7zip-full

          MACOS_RELEASE_DIR="$(find builds -maxdepth 1 -type d -name 'macOS-*-Release-success_builds' | head -n 1)"
          MACOS_RELWITHDEBINFO_DIR="$(find builds -maxdepth 1 -type d -name 'macOS-*-RelWithDebInfo-success_builds' | head -n 1)"
          test -n "$MACOS_RELEASE_DIR"
          test -n "$MACOS_RELWITHDEBINFO_DIR"
          
          cp builds/windows-latest-Release-success_builds/* Project_DJ_Godot/addons/Project_DJ_Godot/win/release
          cp builds/ubuntu-latest-Release-success_builds/* Project_DJ_Godot/addons/Project_DJ_Godot/linux/release
          cp "$MACOS_RELEASE_DIR"/* Project_DJ_Godot/addons/Project_DJ_Godot/macos/release
          cp builds/windows-latest-RelWithDebInfo-success_builds/* Project_DJ_Godot/addons/Project_DJ_Godot/win/debug
          cp builds/ubuntu-latest-RelWithDebInfo-success_builds/* Project_DJ_Godot/addons/Project_DJ_Godot/linux/debug
          cp "$MACOS_RELWITHDEBINFO_DIR"/* Project_DJ_Godot/addons/Project_DJ_Godot/macos/debug

          find Project_DJ_Godot/addons -type f | grep -E "\.(so|dll|dylib|exe)$" | while read -r file; do
            echo "found: $file"
            outfile="${file}.7z"
          
            7z a -t7z -m0=LZMA2 -mx=3 -v20m -mf- "$outfile" "$file" >/dev/null \
              && echo "Compressed to: ${outfile}.001" \
              || echo "Failed: $file"

            rm "$file"
          done
          cp builds/version-of-success_builds/* Project_DJ_Godot/
          
          cd Project_DJ_Godot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config lfs.url "https://rrop:${{ secrets.LFS_TOKEN }}@pdje.uk/rrop/PDJE_LFS_REPO.git/info/lfs"
          git lfs track "addons/**"
          
          git add .gitattributes addons/ PDJE_VERSION PDJE_WRAPPER_VERSION 
          git commit -m "AUTO_PUBLISH_TRIG $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
          git lfs push origin HEAD
          
      
